# Builds the programs and runs the checks described in CLAUDE.md.
# Ubuntu 24.04 has the same clang-format and clang-tidy (18) as the
# development machine, and other versions lay out the code differently.
name: CI

on:
  push:
  pull_request:

jobs:
  style:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev
      - name: Check style
        run: make check-style

  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev
      - name: Build
        run: make all EXTRA_FLAGS=-Werror
      - name: Check the bots' games
        run: make check-bots
      - name: Check the tablebases
        run: make check-tables
